name: PR Open — App CI
on:
  pull_request:
    paths-ignore:
      - 'iac/**'
      - '**/Jenkinsfile'
    branches: [main]
    types: [opened, synchronize]

jobs:
  app-ci:
    uses: proops2026-taskmanager/proops2026-cicd-platform/.github/workflows/reusable-app-ci.yml@v3
    with:
      runtime-version: "20"
      project-name: "proops2026-taskmanager"
      service-name: "task-service"
      image-tag: ${{ github.sha }}
      push-image: false                # PR open = build, don't push
      db-name: "tasks_test_db"
      service-port: "3002"
      extra-env: |
        REDIS_URL=redis://localhost:6379
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
